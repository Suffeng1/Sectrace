[project]
name = "sectrace"
version = "0.0.0"
description = "Planned safe multi-Agent security incident audit demo"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "starlette>=0.50,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi",
  "pydantic>=2",
  "networkx",
  "pytest",
  "playwright",
]
